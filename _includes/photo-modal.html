<div class="location-modal" id="photo-modal" aria-hidden="true">
  <div class="location-modal__backdrop" data-modal-close></div>
  <div class="location-modal__box location-modal__box--photo" role="dialog" aria-modal="true" aria-label="{{ include.alt }} full size photo">
    <button type="button" class="location-modal__close" data-modal-close aria-label="Close">&times;</button>
    <img class="location-modal__photo" src="{{ include.src }}" alt="{{ include.alt }}" />
  </div>
</div>
